name: Pull All Data

on:
  push:
    branches: [dev, prd]
  pull_request:
    branches: [dev, prd]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: weather-ai-478502
  CLOUD_RUN_JOB_NAME: era5-worker
  CLOUD_RUN_REGION: us-east1

jobs:
  build-year-range:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.compute.outputs.years }}
      analytics_shards: ${{ steps.compute.outputs.analytics_shards }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          now = datetime.now(tz=timezone.utc)
          ERA5_END = now.year - 2 if now.month < 4 else now.year - 1
          print(f"years={json.dumps(list(range(2000, ERA5_END + 1)))}")
          print(f"analytics_shards={json.dumps(list(range(20)))}")
          PY

  setup-locations:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev
      - name: Run setup
        run: uv run python cities.py
      - name: Upload locations data
        uses: actions/upload-artifact@v4
        with:
          name: locations-data
          path: |
            cities.csv
            output_tiles/

  deploy-infrastructure:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    env:
      STACK_NAME: pet-data-infrastructure
      BUCKET_NAME: pet-parquet-files
    steps:
      - uses: actions/checkout@v4
      - name: Deploy S3 Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation deploy --template-file template.yml --stack-name "$STACK_NAME" --parameter-overrides BucketName="$BUCKET_NAME" --no-fail-on-empty-changes

  cancel-running-cloud-run-executions:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Cancel running Cloud Run executions
        run: |
          python3 cancel_cloud_run_job_executions.py \
            --job "${{ env.CLOUD_RUN_JOB_NAME }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}"

  clear-pet-output:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [deploy-infrastructure, cancel-running-cloud-run-executions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clear PET Prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python3 clear_s3_prefix.py --bucket pet-parquet-files --prefix pet_data_csv/ --max-workers 8

  provision-cloud-run:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [deploy-infrastructure, cancel-running-cloud-run-executions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy Cloud Run worker
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          CLOUD_RUN_JOB_NAME: ${{ env.CLOUD_RUN_JOB_NAME }}
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: /bin/bash ./cloudrun_provision.sh

  compute-pet-google-era5:
    if: (github.ref_name == 'dev' || github.ref_name == 'prd') && needs.build-year-range.outputs.years != '[]'
    needs: [setup-locations, clear-pet-output, build-year-range, provision-cloud-run]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 16
      fail-fast: true
      matrix:
        year: ${{ fromJSON(needs.build-year-range.outputs.years) }}
        time_shard_index: [0, 1, 2, 3]
    name: ERA5->PET ${{ matrix.year }} time ${{ matrix.time_shard_index }}/4
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Pull ERA5 & Compute PET (Writes straight to S3)
        run: |
          gcloud run jobs execute "${{ env.CLOUD_RUN_JOB_NAME }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" --wait \
            --args="--year=${{ matrix.year }},--city-shard-count=1,--time-shard-index=${{ matrix.time_shard_index }},--time-shard-count=4,--max-workers=1,--concurrency-profile=aggressive,--out-dir=s3://pet-parquet-files"

  generate-analytics:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [compute-pet-google-era5, build-year-range]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      fail-fast: true
      matrix:
        analytics_shard_index: ${{ fromJSON(needs.build-year-range.outputs.analytics_shards) }}
    name: Analytics shard ${{ matrix.analytics_shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev
      - name: Sync Data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: aws s3 sync s3://pet-parquet-files/pet_data_csv/ ./pet_data_csv/
      - name: Generate Analytics
        run: uv run python generate_analytics.py --shard-index ${{ matrix.analytics_shard_index }} --shard-count 20
      - name: Upload Analytics Shard
        uses: actions/upload-artifact@v4
        with:
          name: analytics-shard-${{ matrix.analytics_shard_index }}
          path: analytics_data_csv/

  prepare-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [setup-locations, generate-analytics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev
      - name: Download locations-data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Drop Views And Load Locations
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: |
          uv run python - <<'PY'
          import os, sys, psycopg2
          from pathlib import Path
          conn = psycopg2.connect(os.environ["SUPABASE_DB_URI"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute(Path("drop_views.sql").read_text(encoding="utf-8"))
              cur.execute("TRUNCATE TABLE locations, pet, pet_percentiles, pet_forecast, pet_change CASCADE")
          conn.close()
          PY
          uv run python load.py --append-only --skip-drop-views --skip-create-views --skip-table pet --skip-table pet_percentiles --skip-table pet_forecast --skip-table pet_change

  load-to-db:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [prepare-db-load, generate-analytics, build-year-range]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      fail-fast: true
      matrix:
        load_shard_index: ${{ fromJSON(needs.build-year-range.outputs.analytics_shards) }}
    name: Load shard ${{ matrix.load_shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev
      - name: Sync Data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: aws s3 sync s3://pet-parquet-files/pet_data_csv/ ./pet_data_csv/
      - name: Download analytics shards
        uses: actions/download-artifact@v4
        with:
          pattern: analytics-shard-${{ matrix.load_shard_index }}
          merge-multiple: true
          path: analytics_data_csv
      - name: Load shard to Supabase
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: uv run python load.py --append-only --skip-drop-views --skip-create-views --skip-table locations --analytics-shard-count 20 --load-shard-index ${{ matrix.load_shard_index }} --load-shard-count 20

  finalize-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: load-to-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev
      - name: Recreate Views
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: uv run python load.py --append-only --skip-drop-views --skip-table locations --skip-table pet --skip-table pet_percentiles --skip-table pet_forecast --skip-table pet_change