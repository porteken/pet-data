name: Pull All Data

on:
  push:
    branches: [dev, prd]
  pull_request:
    branches: [dev, prd]
  workflow_dispatch:

env:
  PIPELINE_MONTHS: "5 6 7 8 9"
  WEATHER_TILE_SHARD_COUNT: "4"
  WEATHER_MAX_WORKERS: "1"
  WEATHER_CONCURRENCY_PROFILE: conservative
  MRT_TILE_SHARD_COUNT: "2"
  MRT_MAX_WORKERS: "2"
  MRT_CDS_REQUEST_CONCURRENCY: "4"

jobs:
  build-year-range:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.compute.outputs.years }}
      analytics_shards: ${{ steps.compute.outputs.analytics_shards }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: python build_year_range.py --github >> "$GITHUB_OUTPUT"

  setup-locations:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Generate locations and tile metadata
        run: python cities.py
      - name: Upload locations data
        uses: actions/upload-artifact@v4
        with:
          name: locations-data
          path: |
            cities.csv
            output_tiles/

  deploy-infrastructure:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    env:
      STACK_NAME: pet-data-infrastructure
      BUCKET_NAME: pet-parquet-files
    steps:
      - uses: actions/checkout@v4
      - name: Deploy S3 Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation deploy --template-file template.yml --stack-name "$STACK_NAME" --parameter-overrides BucketName="$BUCKET_NAME" --no-fail-on-empty-changes

  clear-pet-output:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clear PET Prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python3 clear_s3_prefix.py --bucket pet-parquet-files --prefix pet_data_csv/ --max-workers 8

  compute-pet-hybrid:
    if: (github.ref_name == 'dev' || github.ref_name == 'prd') && needs.build-year-range.outputs.years != '[]'
    needs: [build-year-range, setup-locations, clear-pet-output]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.build-year-range.outputs.years) }}
    name: Hybrid PET ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download locations-data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Pull weather, MRT, combine, and PET
        env:
          PET_ANALYTICS_USE_DASK: "1"
          MRT_CDS_REQUEST_CONCURRENCY: ${{ env.MRT_CDS_REQUEST_CONCURRENCY }}
        run: |
          set -euo pipefail
          pids=()
          wait_all() {
            local label="$1"
            for pid in "${pids[@]}"; do
              wait "$pid"
            done
            pids=()
            echo "Completed $label"
          }

          rm -rf weather_data_parquet utci_data_parquet combined_data_parquet pet_data_csv

          for month in $PIPELINE_MONTHS; do
            for (( tile_shard=0; tile_shard<WEATHER_TILE_SHARD_COUNT; tile_shard++ )); do
              python pull_weather_tiles.py \
                --year=${{ matrix.year }} \
                --month="$month" \
                --tile-shard-index="$tile_shard" \
                --tile-shard-count="$WEATHER_TILE_SHARD_COUNT" \
                --max-workers="$WEATHER_MAX_WORKERS" \
                --concurrency-profile="$WEATHER_CONCURRENCY_PROFILE" \
                --out-dir=. &
              pids+=("$!")
            done
            wait_all "weather-month-$month"
          done

          for month in $PIPELINE_MONTHS; do
            for (( tile_shard=0; tile_shard<MRT_TILE_SHARD_COUNT; tile_shard++ )); do
              python pull_mrt.py \
                --year=${{ matrix.year }} \
                --month="$month" \
                --tile-shard-index="$tile_shard" \
                --tile-shard-count="$MRT_TILE_SHARD_COUNT" \
                --max-workers="$MRT_MAX_WORKERS" \
                --out-dir=. &
              pids+=("$!")
            done
            wait_all "mrt-month-$month"
          done

          for (( tile_shard=0; tile_shard<MRT_TILE_SHARD_COUNT; tile_shard++ )); do
            python combine.py \
              --year=${{ matrix.year }} \
              --shard-index="$tile_shard" \
              --shard-count="$MRT_TILE_SHARD_COUNT" &
            pids+=("$!")
          done
          wait_all combine

          for (( tile_shard=0; tile_shard<MRT_TILE_SHARD_COUNT; tile_shard++ )); do
            python calculate_pet.py \
              --year=${{ matrix.year }} \
              --shard-index="$tile_shard" \
              --shard-count="$MRT_TILE_SHARD_COUNT" &
            pids+=("$!")
          done
          wait_all pet
      - name: Sync PET data to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: aws s3 sync ./pet_data_csv/ s3://pet-parquet-files/pet_data_csv/

  generate-analytics:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [compute-pet-hybrid, build-year-range]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        analytics_shard_index: ${{ fromJSON(needs.build-year-range.outputs.analytics_shards) }}
    name: Analytics shard ${{ matrix.analytics_shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Sync Data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: aws s3 sync s3://pet-parquet-files/pet_data_csv/ ./pet_data_csv/
      - name: Generate Analytics
        env:
          PET_ANALYTICS_USE_DASK: "1"
        run: python generate_analytics.py --shard-index ${{ matrix.analytics_shard_index }} --shard-count 20
      - name: Upload Analytics Shard
        uses: actions/upload-artifact@v4
        with:
          name: analytics-shard-${{ matrix.analytics_shard_index }}
          path: analytics_data_csv/

  prepare-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [setup-locations, generate-analytics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Database Dependencies
        run: pip install -r requirements.txt
      - name: Download locations-data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Drop Views And Load Locations
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: |
          python - <<'PY'
          import os, psycopg2
          from pathlib import Path
          conn = psycopg2.connect(os.environ["SUPABASE_DB_URI"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute(Path("drop_views.sql").read_text(encoding="utf-8"))
              cur.execute("TRUNCATE TABLE locations, pet, pet_percentiles, pet_forecast, pet_change CASCADE")
          conn.close()
          PY
          python load.py --append-only --skip-drop-views --skip-create-views --skip-table pet --skip-table pet_percentiles --skip-table pet_forecast --skip-table pet_change

  load-to-db:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [prepare-db-load, generate-analytics, build-year-range]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        load_shard_index: ${{ fromJSON(needs.build-year-range.outputs.analytics_shards) }}
    name: Load shard ${{ matrix.load_shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Database Dependencies
        run: pip install -r requirements.txt
      - name: Sync Data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: aws s3 sync s3://pet-parquet-files/pet_data_csv/ ./pet_data_csv/
      - name: Download analytics shards
        uses: actions/download-artifact@v4
        with:
          pattern: analytics-shard-${{ matrix.load_shard_index }}
          merge-multiple: true
          path: analytics_data_csv
      - name: Load shard to Supabase
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: python load.py --append-only --skip-drop-views --skip-create-views --skip-table locations --analytics-shard-count 20 --load-shard-index ${{ matrix.load_shard_index }} --load-shard-count 20

  finalize-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: load-to-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Database Dependencies
        run: pip install -r requirements.txt
      - name: Recreate Views
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: python load.py --append-only --skip-drop-views --skip-table locations --skip-table pet --skip-table pet_percentiles --skip-table pet_forecast --skip-table pet_change