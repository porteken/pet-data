name: Yearly Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 2 1 *'

env:
  PIPELINE_MONTHS: "5 6 7 8 9"
  WEATHER_TILE_SHARD_COUNT: "4"
  WEATHER_MAX_WORKERS: "1"
  WEATHER_CONCURRENCY_PROFILE: conservative
  MRT_TILE_SHARD_COUNT: "2"
  MRT_MAX_WORKERS: "2"
  MRT_CDS_REQUEST_CONCURRENCY: "4"

jobs:
  build-target-window:
    runs-on: ubuntu-latest
    outputs:
      target_year: ${{ steps.compute.outputs.target_year }}
      window_start: ${{ steps.compute.outputs.window_start }}
      window_end: ${{ steps.compute.outputs.window_end }}
      analytics_shards: ${{ steps.compute.outputs.analytics_shards }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: python build_year_range.py --github --yearly >> "$GITHUB_OUTPUT"

  setup-locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate locations and tile metadata
        run: python cities.py
      - name: Upload locations-data
        uses: actions/upload-artifact@v4
        with:
          name: locations-data
          path: |
            cities.csv
            output_tiles/
          retention-days: 1

  compute-pet:
    needs: [build-target-window, setup-locations]
    runs-on: ubuntu-latest
    name: Hybrid PET ${{ needs.build-target-window.outputs.target_year }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download locations-data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Pull weather, MRT, combine, and PET
        env:
          MRT_CDS_REQUEST_CONCURRENCY: ${{ env.MRT_CDS_REQUEST_CONCURRENCY }}
        run: |
          set -euo pipefail
          pids=()
          wait_all() {
            local label="$1"
            for pid in "${pids[@]}"; do
              wait "$pid"
            done
            pids=()
            echo "Completed $label"
          }

          rm -rf weather_data_parquet utci_data_parquet combined_data_parquet pet_data_csv

          for month in $PIPELINE_MONTHS; do
            for (( tile_shard=0; tile_shard<WEATHER_TILE_SHARD_COUNT; tile_shard++ )); do
              python pull_weather_tiles.py \
                --year=${{ needs.build-target-window.outputs.target_year }} \
                --month="$month" \
                --tile-shard-index="$tile_shard" \
                --tile-shard-count="$WEATHER_TILE_SHARD_COUNT" \
                --max-workers="$WEATHER_MAX_WORKERS" \
                --concurrency-profile="$WEATHER_CONCURRENCY_PROFILE" \
                --out-dir=. &
              pids+=("$!")
            done
            wait_all "weather-month-$month"
          done

          for month in $PIPELINE_MONTHS; do
            for (( tile_shard=0; tile_shard<MRT_TILE_SHARD_COUNT; tile_shard++ )); do
              python pull_mrt.py \
                --year=${{ needs.build-target-window.outputs.target_year }} \
                --month="$month" \
                --tile-shard-index="$tile_shard" \
                --tile-shard-count="$MRT_TILE_SHARD_COUNT" \
                --max-workers="$MRT_MAX_WORKERS" \
                --out-dir=. &
              pids+=("$!")
            done
            wait_all "mrt-month-$month"
          done

          for (( tile_shard=0; tile_shard<MRT_TILE_SHARD_COUNT; tile_shard++ )); do
            python combine.py \
              --year=${{ needs.build-target-window.outputs.target_year }} \
              --shard-index="$tile_shard" \
              --shard-count="$MRT_TILE_SHARD_COUNT" &
            pids+=("$!")
          done
          wait_all combine

          for (( tile_shard=0; tile_shard<MRT_TILE_SHARD_COUNT; tile_shard++ )); do
            python calculate_pet.py \
              --year=${{ needs.build-target-window.outputs.target_year }} \
              --shard-index="$tile_shard" \
              --shard-count="$MRT_TILE_SHARD_COUNT" &
            pids+=("$!")
          done
          wait_all pet
      - name: Upload PET Parquet
        uses: actions/upload-artifact@v4
        with:
          name: pet-data
          path: pet_data_csv/
          retention-days: 1

  export-existing-data:
    needs: build-target-window
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Export Existing PET Rows
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: python historical_pet_update.py export "${{ needs.build-target-window.outputs.window_start }}" "${{ needs.build-target-window.outputs.window_end }}" existing_pet.csv
      - name: Upload Exported CSV
        uses: actions/upload-artifact@v4
        with:
          name: existing-pet-csv
          path: existing_pet.csv
          retention-days: 1

  generate-analytics:
    needs: [build-target-window, compute-pet, export-existing-data]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.build-target-window.outputs.analytics_shards) }}
    name: Analytics Shard ${{ matrix.shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download Computed PET Data
        uses: actions/download-artifact@v4
        with:
          name: pet-data
          path: pet_data_csv
      - name: Download Exported CSV
        uses: actions/download-artifact@v4
        with:
          name: existing-pet-csv
      - name: Build Full PET CSV For Analytics
        run: python historical_pet_update.py merge pet_full.csv existing_pet.csv --dirs pet_data_csv
      - name: Generate Analytics
        env:
          PET_ANALYTICS_USE_DASK: "1"
        run: python generate_analytics.py --pet-csv pet_full.csv --shard-index ${{ matrix.shard_index }} --shard-count 20
      - name: Upload analytics shard
        uses: actions/upload-artifact@v4
        with:
          name: analytics-shard-${{ matrix.shard_index }}
          path: analytics_data_csv/
          retention-days: 1

  prepare-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [build-target-window, generate-analytics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Clean Up Database Window
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: python historical_pet_update.py delete-window "${{ needs.build-target-window.outputs.window_start }}" "${{ needs.build-target-window.outputs.window_end }}"

  load-to-db:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [prepare-db-load, generate-analytics, compute-pet, build-target-window]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.build-target-window.outputs.analytics_shards) }}
    name: Load Shard ${{ matrix.shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download Computed PET Data
        uses: actions/download-artifact@v4
        with:
          name: pet-data
          path: pet_data_csv
      - name: Download Analytics Shard
        uses: actions/download-artifact@v4
        with:
          name: analytics-shard-${{ matrix.shard_index }}
          path: analytics_data_csv
      - name: Load Shard to Database
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: python load.py --append-only --skip-drop-views --skip-create-views --skip-table locations --analytics-shard-count 20 --load-shard-index ${{ matrix.shard_index }} --load-shard-count 20

  finalize-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: load-to-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Recreate Views
        env:
          SUPABASE_DB_URI: ${{ github.ref_name == 'dev' && secrets.SUPABASE_DB_URI_DEV || secrets.SUPABASE_DB_URI }}
        run: python load.py --append-only --skip-drop-views --skip-table locations --skip-table pet --skip-table pet_percentiles --skip-table pet_forecast --skip-table pet_change