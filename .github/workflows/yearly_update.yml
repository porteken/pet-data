name: Yearly Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 2 1 *'

jobs:
  build-target-window:
    runs-on: ubuntu-latest
    outputs:
      target_year: ${{ steps.compute.outputs.target_year }}
      window_start: ${{ steps.compute.outputs.window_start }}
      window_end: ${{ steps.compute.outputs.window_end }}
      analytics_shards: ${{ steps.compute.outputs.analytics_shards }}
      months: ${{ steps.compute.outputs.months }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: python build_year_range.py --github --yearly >> "$GITHUB_OUTPUT"

  process-weather:
    needs: build-target-window
    runs-on: ubuntu-latest
    name: Pull Weather (${{ needs.build-target-window.outputs.target_year }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-cds.txt
      - name: Cancel Pending Jobs
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
        run: python cancel_cds_jobs.py
      - name: Pull Weather Data
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
        run: |
          python pull_weather.py \
            --year ${{ needs.build-target-window.outputs.target_year }} \
            --weather-city-shard-count 1 \
            --max-workers 10
      - name: Upload Weather Parquet
        uses: actions/upload-artifact@v4
        with:
          name: weather-parquet-yearly
          path: weather_data_parquet/
          retention-days: 1

  process-mrt:
    needs: build-target-window
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        month: ${{ fromJSON(needs.build-target-window.outputs.months) }}
    name: Pull MRT (Month ${{ matrix.month }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-cds.txt
      - name: Pull MRT Data
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
        run: |
          python pull_mrt.py \
            --year ${{ needs.build-target-window.outputs.target_year }} \
            --month ${{ matrix.month }} \
            --max-workers 10
      - name: Upload MRT Parquet
        uses: actions/upload-artifact@v4
        with:
          name: mrt-parquet-month-${{ matrix.month }}
          path: utci_data_parquet/
          retention-days: 1

  combine-and-calculate-pet:
    needs: [build-target-window, process-weather, process-mrt]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3] # 4 shards for PET calc
    name: Compute PET Shard ${{ matrix.shard_index }}/4
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download Weather Parquet
        uses: actions/download-artifact@v4
        with:
          name: weather-parquet-yearly
          path: weather_data_parquet
      - name: Download MRT Parquet
        uses: actions/download-artifact@v4
        with:
          pattern: mrt-parquet-month-*
          path: utci_data_parquet
          merge-multiple: true
      - name: Combine Datasets
        run: |
          python combine_datasets.py \
            --year ${{ needs.build-target-window.outputs.target_year }}
      - name: Calculate PET
        run: |
          python calculate_pet.py \
            --year ${{ needs.build-target-window.outputs.target_year }} \
            --tile-shard-index ${{ matrix.shard_index }} \
            --tile-shard-count 4
      - name: Upload PET Shard
        uses: actions/upload-artifact@v4
        with:
          name: pet-shard-${{ matrix.shard_index }}
          path: pet_data_csv/
          retention-days: 1

  export-existing-data:
    needs: build-target-window
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Export Existing PET Rows
        env:
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
        run: |
          python historical_pet_update.py export \
            "${{ needs.build-target-window.outputs.window_start }}" \
            "${{ needs.build-target-window.outputs.window_end }}" \
            existing_pet.csv
      - name: Upload Exported CSV
        uses: actions/upload-artifact@v4
        with:
          name: existing-pet-csv
          path: existing_pet.csv
          retention-days: 1

  generate-analytics:
    needs: [build-target-window, combine-and-calculate-pet, export-existing-data]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.build-target-window.outputs.analytics_shards) }}
    name: Analytics Shard ${{ matrix.shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Download PET Shards
        uses: actions/download-artifact@v4
        with:
          pattern: pet-shard-*
          path: pet_data_csv
          merge-multiple: true
      - name: Download Exported CSV
        uses: actions/download-artifact@v4
        with:
          name: existing-pet-csv
      - name: Build Full PET CSV For Analytics
        run: |
          python historical_pet_update.py merge \
            pet_full.csv existing_pet.csv --dirs pet_data_csv
      - name: Generate Analytics
        run: |
          python generate_analytics.py \
            --pet-csv pet_full.csv \
            --shard-index ${{ matrix.shard_index }} \
            --shard-count 20
      - name: Upload analytics shard
        uses: actions/upload-artifact@v4
        with:
          name: analytics-shard-${{ matrix.shard_index }}
          path: analytics_data_csv/
          retention-days: 1

  prepare-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [build-target-window, generate-analytics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Clean Up Database Window
        env:
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
        run: |
          python historical_pet_update.py delete-window \
            "${{ needs.build-target-window.outputs.window_start }}" \
            "${{ needs.build-target-window.outputs.window_end }}"

  load-to-db:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: [prepare-db-load, generate-analytics, combine-and-calculate-pet, build-target-window]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.build-target-window.outputs.analytics_shards) }}
    name: Load Shard ${{ matrix.shard_index }}/20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download PET Shards
        uses: actions/download-artifact@v4
        with:
          pattern: pet-shard-*
          path: pet_data_csv
          merge-multiple: true
      - name: Download Analytics Shard
        uses: actions/download-artifact@v4
        with:
          name: analytics-shard-${{ matrix.shard_index }}
          path: analytics_data_csv
      - name: Load Shard to Database
        env:
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
        run: |
          python load.py \
            --append-only \
            --skip-drop-views \
            --skip-create-views \
            --skip-table locations \
            --analytics-shard-count 20 \
            --load-shard-index ${{ matrix.shard_index }} \
            --load-shard-count 20

  finalize-db-load:
    if: github.ref_name == 'dev' || github.ref_name == 'prd'
    needs: load-to-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Recreate Views
        env:
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
        run: |
          python load.py \
            --append-only \
            --skip-drop-views \
            --skip-table locations \
            --skip-table pet \
            --skip-table pet_percentiles \
            --skip-table pet_forecast \
            --skip-table pet_change
