name: Yearly Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 2 1 *"

env:
  GCP_PROJECT_ID: weather-ai-478502
  CLOUD_RUN_JOB_NAME: era5-worker
  CLOUD_RUN_REGION: us-east1
  ERA5_BATCH_HOURS: "720"

jobs:
  build-target-window:
    if: github.ref_name == 'prd'
    runs-on: ubuntu-latest
    outputs:
      target_year: ${{ steps.compute.outputs.target_year }}
      window_start: ${{ steps.compute.outputs.window_start }}
      window_end: ${{ steps.compute.outputs.window_end }}
      analytics_shards: ${{ steps.compute.outputs.analytics_shards }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - id: compute
        run: python build_year_range.py --github --yearly >> "$GITHUB_OUTPUT"

  deploy-infrastructure:
    if: github.ref_name == 'prd'
    runs-on: ubuntu-latest
    env:
      STACK_NAME: pet-data-infrastructure
      BUCKET_NAME: pet-parquet-files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Deploy S3 Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation deploy --template-file template.yml --stack-name "$STACK_NAME" --parameter-overrides BucketName="$BUCKET_NAME" --no-fail-on-empty-changes

  cancel-running-cloud-run-executions:
    if: github.ref_name == 'prd'
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Cancel running Cloud Run executions
        run: |
          python3 cancel_cloud_run_job_executions.py \
            --job "${{ env.CLOUD_RUN_JOB_NAME }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}"

  clear-pet-output:
    if: github.ref_name == 'prd'
    needs: [build-target-window, deploy-infrastructure, cancel-running-cloud-run-executions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Clear PET Prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python3 clear_s3_prefix.py --bucket pet-parquet-files --prefix pet_data_csv/year=${{ needs.build-target-window.outputs.target_year }}/ --max-workers 8
      - name: Clear Wetbulb Prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python3 clear_s3_prefix.py --bucket pet-parquet-files --prefix wetbulb_data_csv/year=${{ needs.build-target-window.outputs.target_year }}/ --max-workers 8

  provision-cloud-run:
    if: github.ref_name == 'prd'
    needs: [deploy-infrastructure, cancel-running-cloud-run-executions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Build and deploy Cloud Run worker
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          CLOUD_RUN_JOB_NAME: ${{ env.CLOUD_RUN_JOB_NAME }}
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: /bin/bash ./cloudrun_provision.sh

  compute-pet-google-era5-a:
    if: github.ref_name == 'prd' && needs.build-target-window.outputs.target_year != ''
    needs: [build-target-window, clear-pet-output, provision-cloud-run]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 8
      fail-fast: true
      matrix:
        time_shard_index: [0, 1, 2, 3, 4, 5, 6]
    name: ERA5->PET A ${{ needs.build-target-window.outputs.target_year }} time ${{ matrix.time_shard_index }}/13
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Pull ERA5 & Compute PET (Writes straight to S3)
        run: |
          gcloud run jobs execute "${{ env.CLOUD_RUN_JOB_NAME }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" --wait \
            --args="--year=${{ needs.build-target-window.outputs.target_year }},--city-shard-count=1,--time-shard-index=${{ matrix.time_shard_index }},--time-shard-count=13,--max-workers=1,--batch-hours=${{ env.ERA5_BATCH_HOURS }},--concurrency-profile=aggressive,--out-dir=s3://pet-parquet-files"

  compute-pet-google-era5-b:
    if: github.ref_name == 'prd' && needs.build-target-window.outputs.target_year != ''
    needs: [build-target-window, clear-pet-output, provision-cloud-run]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 8
      fail-fast: true
      matrix:
        time_shard_index: [7, 8, 9, 10, 11, 12]
    name: ERA5->PET B ${{ needs.build-target-window.outputs.target_year }} time ${{ matrix.time_shard_index }}/13
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Pull ERA5 & Compute PET (Writes straight to S3)
        run: |
          gcloud run jobs execute "${{ env.CLOUD_RUN_JOB_NAME }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" --wait \
            --args="--year=${{ needs.build-target-window.outputs.target_year }},--city-shard-count=1,--time-shard-index=${{ matrix.time_shard_index }},--time-shard-count=13,--max-workers=1,--batch-hours=${{ env.ERA5_BATCH_HOURS }},--concurrency-profile=aggressive,--out-dir=s3://pet-parquet-files"

  prepare-db-load:
    if: github.ref_name == 'prd'
    needs: [build-target-window, compute-pet-google-era5-a, compute-pet-google-era5-b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev # NOSONAR
      - name: Clean Up Database Window
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
        run: uv run --locked python historical_pet_update.py delete-window "${{ needs.build-target-window.outputs.window_start }}" "${{ needs.build-target-window.outputs.window_end }}"

  load-to-db:
    if: github.ref_name == 'prd'
    needs: [prepare-db-load, build-target-window]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      fail-fast: true
      matrix:
        load_shard_index: ${{ fromJSON(needs.build-target-window.outputs.analytics_shards) }}
    name: Load shard ${{ matrix.load_shard_index }}/20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev # NOSONAR
      - name: Sync shard PET data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          PREFIX: pet_data_csv/year=${{ needs.build-target-window.outputs.target_year }}/
        run: |
          echo "Syncing PET data for year: ${{ needs.build-target-window.outputs.target_year }}"
          mkdir -p pet_data_csv
          echo "Syncing s3://pet-parquet-files/${PREFIX}"
          aws s3 sync "s3://pet-parquet-files/${PREFIX}" "./${PREFIX}"
      - name: Sync shard wetbulb data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          PREFIX: wetbulb_data_csv/year=${{ needs.build-target-window.outputs.target_year }}/
        run: |
          echo "Syncing wetbulb data for year: ${{ needs.build-target-window.outputs.target_year }}"
          mkdir -p wetbulb_data_csv
          echo "Syncing s3://pet-parquet-files/${PREFIX}"
          aws s3 sync "s3://pet-parquet-files/${PREFIX}" "./${PREFIX}"
      - name: Load shard to Postgres
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
        run: uv run --locked python load.py --append-only --skip-drop-views --skip-create-views --skip-table locations --load-shard-index ${{ matrix.load_shard_index }} --load-shard-count 20

  finalize-db-load:
    if: github.ref_name == 'prd'
    needs: load-to-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev # NOSONAR
      - name: Recreate Views
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
        run: uv run --locked python load.py --append-only --skip-table locations --skip-table pet --skip-table wetbulb # NOSONAR
