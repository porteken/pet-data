name: PET Data Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  setup-locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install pandas numpy
      - name: Run cities.py
        run: python cities.py
      - name: Upload cities.csv
        uses: actions/upload-artifact@v4
        with:
          name: locations-data
          path: cities.csv

  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy S3 Bucket CloudFormation Stack
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation deploy \
            --template-file template.yml \
            --stack-name pet-data-infrastructure \
            --parameter-overrides BucketName=pet-parquet-files \
            --no-fail-on-empty-changes

  process-shard:
    needs: [setup-locations, deploy-infrastructure]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        year: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
        month: ["05", "06", "07", "08", "09"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install All Dependencies
        run: pip install cdsapi pyarrow pandas xarray cfgrib netCDF4 tqdm
        
      - name: Download Locations Data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
          
      - name: Pull Weather and MRT
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          python pull.py --year ${{ matrix.year }} --month ${{ matrix.month }}
          
      - name: Upload Raw Parquet to S3 (Backup)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 sync ./weather_data_parquet s3://pet-parquet-files/weather_data_parquet/
          aws s3 sync ./utci_data_parquet s3://pet-parquet-files/utci_data_parquet/
          
      - name: Combine and Compute PET
        run: |
          python combine.py --year ${{ matrix.year }} --month ${{ matrix.month }}
          python calculate_pet.py --year ${{ matrix.year }} --month ${{ matrix.month }}
          
      - name: Upload Computed PET Shard
        uses: actions/upload-artifact@v4
        with:
          name: pet-shard-${{ matrix.year }}-${{ matrix.month }}
          path: pet_${{ matrix.year }}_${{ matrix.month }}.csv

  generate-analytics:
    needs: process-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install pandas numpy
      - name: Download All PET Shards
        uses: actions/download-artifact@v4
        with:
          pattern: pet-shard-*
          merge-multiple: true
      - name: Generate Tables
        run: python generate_tables.py
      - name: Upload Final Analytics CSVs
        uses: actions/upload-artifact@v4
        with:
          name: final-csvs
          path: |
            pet.csv
            percentiles.csv
            forecast.csv
            change_per_decade.csv

  load-to-db:
    needs: [setup-locations, generate-analytics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Database Dependencies
        run: pip install psycopg2-binary
      - name: Download final-csvs
        uses: actions/download-artifact@v4
        with:
          name: final-csvs
          path: .
      - name: Download locations-data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Load to Supabase
        env:
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
        run: python load.py