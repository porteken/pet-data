name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  setup-locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run cities.py
        run: python cities.py
      - name: Run boxes.py
        run: python boxes.py
      - name: Upload locations data
        uses: actions/upload-artifact@v4
        with:
          name: locations-data
          path: |
            cities.csv
            output_tiles/

  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy S3 Bucket CloudFormation Stack
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation deploy \
            --template-file template.yml \
            --stack-name pet-data-infrastructure \
            --parameter-overrides BucketName=pet-parquet-files \
            --no-fail-on-empty-changes

  process-weather:
    needs: [sonarqube, setup-locations, deploy-infrastructure]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        year: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    name: ERA5 Weather ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
          
      - name: Install All Dependencies
        run: pip install -r requirements.txt

      - name: Download Locations Data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .

      - name: Pull Weather
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python pull_cds.py --dataset weather --year ${{ matrix.year }} --month 01

      - name: Upload Weather Shards to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: aws s3 sync ./weather_data_parquet/year=${{ matrix.year }}/ s3://pet-parquet-files/weather_data_parquet/year=${{ matrix.year }}/

  process-mrt:
    needs: [sonarqube, setup-locations, deploy-infrastructure]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        year: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
        month: ["05", "06", "07", "08", "09"]
    name: MRT ${{ matrix.year }}-${{ matrix.month }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install All Dependencies
        run: pip install -r requirements.txt
      - name: Download Locations Data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Pull MRT
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python pull_cds.py --dataset mrt --year ${{ matrix.year }} --month ${{ matrix.month }}
      - name: Upload MRT Shards to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          MONTH_NUM=$((10#${{ matrix.month }}))
          aws s3 sync ./utci_data_parquet/year=${{ matrix.year }}/month=${MONTH_NUM}/ s3://pet-parquet-files/utci_data_parquet/year=${{ matrix.year }}/month=${MONTH_NUM}/

  process-pet:
    needs: [setup-locations, process-weather, process-mrt]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        year: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
        month: ["05", "06", "07", "08", "09"]
    name: PET ${{ matrix.year }}-${{ matrix.month }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install All Dependencies
        run: pip install -r requirements.txt
      - name: Download Locations Data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Download Weather and MRT Shards from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          MONTH_NUM=$((10#${{ matrix.month }}))
          mkdir -p ./weather_data_parquet/year=${{ matrix.year }}
          mkdir -p ./utci_data_parquet/year=${{ matrix.year }}/month=${MONTH_NUM}
          aws s3 sync s3://pet-parquet-files/weather_data_parquet/year=${{ matrix.year }}/ ./weather_data_parquet/year=${{ matrix.year }}/
          aws s3 sync s3://pet-parquet-files/utci_data_parquet/year=${{ matrix.year }}/month=${MONTH_NUM}/ ./utci_data_parquet/year=${{ matrix.year }}/month=${MONTH_NUM}/
      - name: Combine and Compute PET
        run: |
          python combine.py --year ${{ matrix.year }} --month ${{ matrix.month }}
          python calculate_pet.py --year ${{ matrix.year }} --month ${{ matrix.month }}
      - name: Upload Computed PET Shard
        uses: actions/upload-artifact@v4
        with:
          name: pet-shard-${{ matrix.year }}-${{ matrix.month }}
          path: pet_${{ matrix.year }}_${{ matrix.month }}.csv

  generate-analytics:
    needs: process-pet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download All PET Shards
        uses: actions/download-artifact@v4
        with:
          pattern: pet-shard-*
          merge-multiple: true
      - name: Generate Tables
        run: python generate_tables.py
      - name: Upload Final Analytics CSVs
        uses: actions/upload-artifact@v4
        with:
          name: final-csvs
          path: |
            pet.csv
            percentiles.csv
            forecast.csv
            change_per_decade.csv

  load-to-db:
    needs: [setup-locations, generate-analytics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Database Dependencies
        run: pip install -r requirements.txt
      - name: Download final-csvs
        uses: actions/download-artifact@v4
        with:
          name: final-csvs
          path: .
      - name: Download locations-data
        uses: actions/download-artifact@v4
        with:
          name: locations-data
          path: .
      - name: Load to Supabase
        env:
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
        run: python load.py
